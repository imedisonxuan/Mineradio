name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build macOS app (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dmg --arm64 --x64 \
            -c.mac.icon=build/icon.png \
            -c.mac.category=public.app-category.music \
            -c.mac.identity=null \
            --publish never

      - name: List output
        if: always()
        run: ls -lh dist || true

      - name: Upload dmg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mineradio-mac-dmg
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn
